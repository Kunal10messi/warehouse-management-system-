{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card" style="max-width:600px; margin:auto;">

        <h2>Add Device</h2>

        <form method="post">
            {% csrf_token %}

            <label>Serial Number</label>
            {{ form.serial_number }}

            <label>Device Type</label>
            {{ form.device_type }}

            <label>Brand</label>
            {{ form.brand }}

            <label>Model</label>
            {{ form.model }}

            <label>Configuration</label>
            {{ form.configuration }}

            <label>Location</label>
            {{ form.location }}

            <label>Status</label>
            {{ form.status }}

            <button type="submit" class="btn btn-primary">Add Device</button>

        </form>

    </div>

</div>

{% endblock %}
